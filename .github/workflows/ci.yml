name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-diff:
    name: ShellCheck & Patch Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          make lint

      - name: Verify Patch Consistency
        run: |
          make diff-check

  matrix-test:
    name: Container Matrix Test
    runs-on: ubuntu-latest
    needs: lint-and-diff
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Container Test Matrix
        run: |
          ./scripts/test.sh
